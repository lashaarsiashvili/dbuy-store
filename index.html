    <!-- Dynamic Open Graph & Meta Tags Head Initializer -->
    <script>
      (function() {
        try {
          var origin = window.location.origin || 'https://dbuystore.com';
          var path = window.location.pathname || '';
          var params = new URLSearchParams(window.location.search || '');
          var targetSlugOrId = '';

          // 1. Detect target product identifier from URL
          var segments = path.replace(/^\/+|\/+$/g, '').split('/');
          if (segments[0] === 'b' && segments[1]) {
            targetSlugOrId = decodeURIComponent(segments[1]);
          } else if (segments[0] === 'product' && segments[1]) {
            targetSlugOrId = decodeURIComponent(segments[2] || segments[1]);
          } else if (params.get('product')) {
            targetSlugOrId = decodeURIComponent(params.get('product'));
          } else if (params.get('b')) {
            targetSlugOrId = decodeURIComponent(params.get('b'));
          }

          function slugify(text) {
            return String(text || '')
              .toLowerCase()
              .trim()
              .replace(/[^\w\s\u10A0-\u10FF-]/g, '')
              .replace(/\s+/g, '-')
              .replace(/-+/g, '-');
          }

          // Function to apply meta tags dynamically
          window.__updateOpenGraphTags = function(data) {
            if (!data) return;
            if (data.title) {
              document.title = data.title;
              var ogTitle = document.getElementById('og-title') || document.querySelector('meta[property="og:title"]');
              if (ogTitle) ogTitle.setAttribute('content', data.title);
              var twTitle = document.getElementById('twitter-title') || document.querySelector('meta[name="twitter:title"]');
              if (twTitle) twTitle.setAttribute('content', data.title);
            }
            if (data.description) {
              var metaDesc = document.querySelector('meta[name="description"]');
              if (metaDesc) metaDesc.setAttribute('content', data.description);
              var ogDesc = document.getElementById('og-description') || document.querySelector('meta[property="og:description"]');
              if (ogDesc) ogDesc.setAttribute('content', data.description);
              var twDesc = document.getElementById('twitter-description') || document.querySelector('meta[name="twitter:description"]');
              if (twDesc) twDesc.setAttribute('content', data.description);
            }
            if (data.image) {
              var fullImg = data.image.indexOf('http') === 0 ? data.image : (origin + (data.image.charAt(0) === '/' ? '' : '/') + data.image);
              var ogImg = document.getElementById('og-image') || document.querySelector('meta[property="og:image"]');
              if (ogImg) ogImg.setAttribute('content', fullImg);
              var ogImgSecure = document.getElementById('og-image-secure') || document.querySelector('meta[property="og:image:secure_url"]');
              if (ogImgSecure) ogImgSecure.setAttribute('content', fullImg);
              var twImg = document.getElementById('twitter-image') || document.querySelector('meta[name="twitter:image"]');
              if (twImg) twImg.setAttribute('content', fullImg);
            }
            if (data.url) {
              var ogUrl = document.getElementById('og-url') || document.querySelector('meta[property="og:url"]');
              if (ogUrl) ogUrl.setAttribute('content', data.url);
            }
            if (data.price) {
              var ogPrice = document.getElementById('og-price-amount') || document.querySelector('meta[property="product:price:amount"]');
              if (ogPrice) ogPrice.setAttribute('content', String(data.price));
            }
            if (data.currency) {
              var ogCurr = document.getElementById('og-price-currency') || document.querySelector('meta[property="product:price:currency"]');
              if (ogCurr) ogCurr.setAttribute('content', data.currency);
            }
          };

          // If a product route was requested, attempt instant dynamic hydration
          if (targetSlugOrId) {
            var rawStore = localStorage.getItem('dbuy_custom_products') || localStorage.getItem('products') || '[]';
            var prods = JSON.parse(rawStore);
            var normalizedTarget = targetSlugOrId.toLowerCase().trim();
            var matched = null;

            for (var i = 0; i < prods.length; i++) {
              var p = prods[i];
              if (!p) continue;
              if (String(p.id).toLowerCase() === normalizedTarget ||
                  (p.customSlug && p.customSlug.toLowerCase() === normalizedTarget) ||
                  (p.title && slugify(p.title) === normalizedTarget)) {
                matched = p;
                break;
              }
            }

            if (matched) {
              var title = matched.titleKa || matched.title_ka || matched.title;
              var price = matched.price || 0;
              var origPrice = matched.origPrice && matched.origPrice > price ? matched.origPrice : null;
              var savings = origPrice ? Math.round(origPrice - price) : 0;
              var headline = '🔥 ' + title + ' — სპეციალური შეთავაზება DBUY-ში!';
              var desc = '💰 ფასი: მხოლოდ ' + price + ' ₾' + (origPrice ? ' (ძველი ფასი: ' + origPrice + ' ₾ — დაზოგეთ ' + savings + ' ₾! 🎉)' : '') + ' | 🚚 სწრაფი მიწოდება მთელ საქართველოში | 🛡️ ოფიციალური გარანტია | შეუკვეთეთ ონლაინ DBUY Store-ში';
              var img = matched.image || (matched.images && matched.images[0]) || '/icon.png';
              var slug = matched.customSlug || slugify(matched.title);
              var canonicalUrl = origin + (matched.customSlug ? ('/b/' + encodeURIComponent(slug)) : ('/product/' + matched.id + '/' + encodeURIComponent(slug)));

              window.__updateOpenGraphTags({
                title: headline,
                description: desc,
                image: img,
                url: canonicalUrl,
                price: price,
                currency: 'GEL'
              });
            }
          }
        } catch (e) {
          // Graceful fallback to default head tags
        }
      })();
    </script>

    <!-- Error resilience script for 3rd-party cross-origin SDKs -->
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        if (message === 'Script error.' || !source || (typeof message === 'string' && message.toLowerCase().indexOf('script error') !== -1)) {
          return true;
        }
        return false;
      };
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason) {
          var str = String(event.reason.message || event.reason);
          if (str.indexOf('Script error') !== -1) {
            event.preventDefault();
          }
        }
      });
    </script>

    <!-- Google Pay API (Loaded in Development/Test environment or when ?gpay=1 / ?test=1 / ?review=1 is specified) -->
    <script>
      (function() {
        try {
          if (typeof window !== 'undefined') {
            var host = (window.location.hostname || '').toLowerCase();
            var search = (window.location.search || '').toLowerCase();
            var isDevOrTest = host.includes('ais-dev') || 
                              host.includes('ais-pre') || 
                              host.includes('localhost') || 
                              host.includes('127.0.0.1') || 
                              host.indexOf('.local') !== -1 || 
                              host.indexOf('webcontainer') !== -1 ||
                              search.indexOf('gpay=1') !== -1 ||
                              search.indexOf('gpay=true') !== -1 ||
                              search.indexOf('review=1') !== -1 ||
                              search.indexOf('test=1') !== -1;
            if (isDevOrTest) {
              var gpayScript = document.createElement('script');
              gpayScript.src = 'https://pay.google.com/gp/p/js/pay.js';
              gpayScript.async = true;
              document.head.appendChild(gpayScript);
            }
          }
        } catch (e) {}
      })();
    </script>
