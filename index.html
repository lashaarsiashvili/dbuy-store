    <!-- Error resilience script for 3rd-party cross-origin SDKs -->
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        if (message === 'Script error.' || !source || (typeof message === 'string' && message.toLowerCase().indexOf('script error') !== -1)) {
          return true;
        }
        return false;
      };
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason) {
          var str = String(event.reason.message || event.reason);
          if (str.indexOf('Script error') !== -1) {
            event.preventDefault();
          }
        }
      });
    </script>
