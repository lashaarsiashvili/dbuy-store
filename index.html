    <!-- Business Legitimacy & Security Schema.org Markup (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Store",
      "@id": "https://dbuystore.com/#store",
      "name": "DBUY Store",
      "url": "https://dbuystore.com",
      "logo": "https://dbuystore.com/assets/logo.png",

      "email": "support@dbuystore.com",
      "priceRange": "$$",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "1209 North Orange Street",
        "addressLocality": "Wilmington",
        "addressRegion": "DE",
        "postalCode": "19801",
        "addressCountry": "US"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+1-888-232-1541",
        "contactType": "customer support",
        "email": "support@dbuystore.com",
        "areaServed": "Worldwide",
        "availableLanguage": ["English", "Georgian"]
      },
      "paymentAccepted": "Credit Card, PayPal, Apple Pay, Google Pay",
      "hasMerchantReturnPolicy": {
        "@type": "MerchantReturnPolicy",
        "applicableCountry": "Worldwide",
        "returnPolicyCategory": "https://schema.org/MerchantReturnFiniteReturnPeriod",
        "merchantReturnDays": 30,
        "returnMethod": "https://schema.org/ReturnByMail",
        "returnFees": "https://schema.org/FreeReturn"
      },
      "iso6523": "0088:dbuystore"
    }
    </script>
    <title>DBUY Store — Quality Tech, Fitness & Everyday Essentials</title>
