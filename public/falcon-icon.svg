<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="dbuy-bag-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="dbuy-handle-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <filter id="dbuy-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Dark Navy Circle Base -->
  <circle cx="50" cy="50" r="48" fill="#0B1120" stroke="#1E293B" stroke-width="2" />

  <!-- Shopping Bag Handle -->
  <path
    d="M 39 36 V 28 C 39 21.5, 44 17.5, 50 17.5 C 56 17.5, 61 21.5, 61 28 V 36"
    stroke="url(#dbuy-handle-gradient)"
    stroke-width="4.5"
    stroke-linecap="round"
  />

  <!-- Shopping Bag Body -->
  <path
    d="M 27 36 H 73 L 67 79 C 66 82, 63 84, 59.5 84 H 40.5 C 37 84, 34 82, 33 79 Z"
    fill="url(#dbuy-bag-gradient)"
    filter="url(#dbuy-glow)"
  />

  <!-- White V Checkmark Notch -->
  <path
    d="M 43 52 L 50 59 L 57 52"
    stroke="#FFFFFF"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
