<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBUY Store | Auth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        #scan-line { animation: scan 2s linear infinite; }
        @keyframes scan { 0% { top: 0; } 50% { top: 100%; } 100% { top: 0; } }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

    <!-- Language Dict -->
    <script>
        const dict = {
            en: { title: "Sign In", register: "Register", face: "Face ID", email: "Email", pass: "Password", name: "Full Name", btn: "Submit" },
            ka: { title: "შესვლა", register: "რეგისტრაცია", face: "Face ID", email: "ელ-ფოსტა", pass: "პაროლი", name: "სახელი", btn: "გაგზავნა" },
            es: { title: "Iniciar sesión", register: "Registro", face: "Face ID", email: "Correo", pass: "Contraseña", name: "Nombre", btn: "Enviar" },
            fr: { title: "Connexion", register: "Inscription", face: "Face ID", email: "Email", pass: "Mot de passe", name: "Nom", btn: "Envoyer" },
            de: { title: "Anmelden", register: "Registrieren", face: "Face ID", email: "E-Mail", pass: "Passwort", name: "Name", btn: "Senden" }
        };
        function setLang(lang) {
            document.querySelectorAll('[data-i18n]').forEach(el => el.innerText = dict[lang][el.getAttribute('data-i18n')]);
        }
    </script>

    <div class="max-w-5xl w-full grid md:grid-cols-2 gap-8 items-center">
        <!-- Showcase -->
        <div class="hidden md:block">
            <h1 class="text-6xl font-black mb-4">DBUY Store</h1>
            <p class="text-2xl text-slate-400">Secure. Modern. Premium.</p>
        </div>

        <!-- Auth -->
        <div class="glass p-8 rounded-3xl w-full max-w-md">
            <select onchange="setLang(this.value)" class="bg-slate-900 rounded-lg p-1 text-sm mb-4">
                <option value="en">ENG</option><option value="ka">GEO</option><option value="es">ESP</option><option value="fr">FRA</option><option value="de">DEU</option>
            </select>
            
            <div class="flex space-x-4 mb-6 border-b border-slate-700">
                <button onclick="document.getElementById('form').classList.remove('hidden'); document.getElementById('face').classList.add('hidden')" data-i18n="title" class="pb-2 font-bold text-blue-400 border-b-2 border-blue-400">Sign In</button>
                <button onclick="document.getElementById('form').classList.remove('hidden'); document.getElementById('face').classList.add('hidden')" data-i18n="register" class="pb-2 font-bold text-slate-400">Register</button>
                <button onclick="document.getElementById('form').classList.add('hidden'); document.getElementById('face').classList.remove('hidden')" data-i18n="face" class="pb-2 font-bold text-slate-400">Face ID</button>
            </div>

            <div id="form" class="space-y-4">
                <input type="text" data-i18n="name" placeholder="Full Name" class="w-full p-3 rounded-xl bg-slate-800">
                <input type="email" data-i18n="email" placeholder="Email" class="w-full p-3 rounded-xl bg-slate-800">
                <input type="password" data-i18n="pass" placeholder="Password" class="w-full p-3 rounded-xl bg-slate-800">
                <button class="w-full py-3 bg-blue-600 rounded-xl font-bold" data-i18n="btn">Submit</button>
            </div>

            <div id="face" class="hidden text-center space-y-4">
                <div class="relative w-full h-48 bg-slate-900 rounded-2xl border border-slate-700">
                    <video id="video" autoplay playsinline class="w-full h-full object-cover hidden"></video>
                    <div id="scan-line" class="absolute inset-0 w-full h-1 bg-purple-500 hidden"></div>
                </div>
                <button onclick="start()" class="w-full py-3 bg-purple-600 rounded-xl font-bold">Start Scan</button>
            </div>
        </div>
    </div>

    <script>
        async function start() {
            const v = document.getElementById('video');
            const s = document.getElementById('scan-line');
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            v.srcObject = stream; v.classList.remove('hidden'); s.classList.remove('hidden');
        }
    </script>
</body>
</html>
