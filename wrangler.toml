name = "dbuy-store"
pages_build_output_dir = "dist"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "dbuystore-db"
database_id = "0ccd6b48-b6d5-4cbe-95eb-71a9a32ee1b8"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "product-images"

